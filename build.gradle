// Gradle build for FDECuratedApps.
// This keeps the AOSP style layout (src/, res/, libs/, AndroidManifest.xml at
// the project root) and points the Android Gradle Plugin at those directories
// via sourceSets.
plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.fde.download'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fde.download.debug'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            // AOSP-style layout: manifest, sources and resources live at the
            // project root instead of the default app/src/main/... location.
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Bundled jars previously linked by libs/Android.bp (java_import down_static_libs)
    implementation files(
        'libs/okhttp-3.12.1.jar',
        'libs/okio-1.15.0.jar',
        'libs/gson-2.10.jar',
        'libs/eventbus.jar'
    )

    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
