// Gradle build for FDECuratedApps.
// This keeps the AOSP style layout (src/, res/, libs/, AndroidManifest.xml at
// the project root) and points the Android Gradle Plugin at those directories
// via sourceSets.
plugins {
    id 'com.android.application' version '8.9.1'
    // Kotlin 2.x is required to read the metadata (mv 2.1.0) of the appfunctions alpha08 AARs.
    // 2.2.10 matches the FDE Launcher3 gradle-modules toolchain.
    id 'org.jetbrains.kotlin.android' version '2.2.10'
    // KSP (version matching Kotlin 2.2.10) runs the appfunctions compiler which generates the
    // metadata assets (assets/app_functions*.xml) that the platform indexer reads at install time.
    id 'com.google.devtools.ksp' version '2.2.10-2.0.2'
}

// Tell the appfunctions compiler to emit the aggregate metadata inventory (app_functions.xml /
// app_functions_v2.xml) that AppSearch consumes. Without this no function is ever indexed.
ksp {
    arg("appfunctions:aggregateAppFunctions", "true")
}

android {
    namespace 'com.fde.download'
    // compileSdk 36 is required by the appfunctions alpha08 AAR's aar-metadata.properties
    // (minCompileSdk=36, minAgpVersion 8.9.1). The Soong build (real artifact) is unaffected.
    compileSdk 36

    defaultConfig {
        applicationId 'com.fde.download.debug'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            // AOSP-style layout: manifest, sources and resources live at the
            // project root instead of the default app/src/main/... location.
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Bundled jars previously linked by libs/Android.bp (java_import down_static_libs)
    implementation files(
        'libs/okhttp-3.12.1.jar',
        'libs/okio-1.15.0.jar',
        'libs/gson-2.10.jar',
        'libs/eventbus.jar'
    )

    // AppFunctions (androidx) for the curated apps store, same version as the FDE Launcher3
    // gradle-modules prebuilts (alpha08) so gradle and Soong builds stay aligned.
    // The appfunctions-compiler KSP processor generates the metadata assets packaged into the
    // APK, so `cmd app_function list-app-functions` can discover the functions on device.
    implementation 'androidx.appfunctions:appfunctions:1.0.0-alpha08'
    implementation 'androidx.appfunctions:appfunctions-service:1.0.0-alpha08'
    ksp 'androidx.appfunctions:appfunctions-compiler:1.0.0-alpha08'

    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

// Run each merge*Assets after its matching ksp*Kotlin so the KSP-generated AppFunctions
// metadata (assets/app_functions*.xml) is present before the APK resources are merged.
tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets") && !name.contains("ArtProfile")) {
        def variant = name - "merge" - "Assets"
        def kspTask = "ksp${variant}Kotlin"
        if (tasks.names.contains(kspTask)) {
            dependsOn(kspTask)
        }
    }
}
